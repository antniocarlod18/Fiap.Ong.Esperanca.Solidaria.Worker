name: Build and Push Docker Image

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   
          
      - name: Restore
        run: dotnet restore Fiap.Ong.Esperanca.Solidaria.Worker.slnx
      
      - name: Build
        run: dotnet build Fiap.Ong.Esperanca.Solidaria.Worker.slnx --configuration Release --no-restore
      
      - name: Testes
        run: dotnet test Fiap.Ong.Esperanca.Solidaria.Worker.slnx --configuration Release --no-build     

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Fiap.Ong.Esperanca.Solidaria.Worker.Api/Dockerfile
          push: true
          tags: |
            antniocarlod18/fiap-ong-esperanca-solidaria-worker:latest
            antniocarlod18/fiap-ong-esperanca-solidaria-worker:${{ github.sha }}
